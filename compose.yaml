services:
  octolab:
    image: ${OCTOLAB_IMAGE:-octolab:local}
    build:
      context: .
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unreported}
    env_file:
      - .env.runtime
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
    ports:
      - "127.0.0.1:${OCTOLAB_HTTP_PORT:-3001}:3001"
    init: true
    restart: unless-stopped
    stop_grace_period: 130s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    volumes:
      - octolab-data:/app/data
volumes:
  octolab-data:
